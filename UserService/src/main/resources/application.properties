spring.application.name=userService

# PostgreSQL database configuration
# PostgreSQL database configuration using environment variables with default values
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:SecReT-PasSwOrD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Connection pool configuration (optional)
spring.datasource.hikari.maximum-pool-size=10

grpc.server.port=9091