services:
  database:
    image: postgres:17.2
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecReT-PasSwOrD
      POSTGRES_DB: database
    volumes:
      - db_data:/var/lib/postgresql/data
      # Mount schema.sql so it's run automatically on container creation
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 10s
      retries: 5

  userservice:
    build:
      context: ./UserService/
      dockerfile: Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
    ports:
      - "8080:8080"
    expose:
      - 9091
    depends_on:
      database:
        condition: service_healthy

  authservice:
    build:
      context: ./AuthService/
      dockerfile: Dockerfile
    environment:
      JWT_PRIVATE_KEY: -----BEGIN PRIVATE KEY----------END PRIVATE KEY-----
      USERSERVICE_URL: http://userservice:8080/user
    ports:
      - "8081:8081"
    depends_on:
      - userservice

  object-management:
    build:
      context: ./object-management
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      JWT_PUBLIC_KEY: -----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
    ports:
      - "8082:8080"
      - "9090:9090" # TODO: Remove this port when the gRPC is secured
    depends_on:
      database:
        condition: service_healthy

  interval-monitor:
    build:
      context: ./interval-monitor
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      JWT_PUBLIC_KEY: -----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
    ports:
      - "8083:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    environment:
      JWT_PUBLIC_KEY: -----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
      NEXTAUTH_SECRET: 9n0Gnw+JJ64DsMSXdejaLVNNlLtVzNmhijQlYorTa3Q=
      NEXTAUTH_URL: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      - authservice

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "4000:4000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - userservice
      - authservice
      - object-management
      - interval-monitor
      # - frontend

  order-list:
    build:
      context: ./order-list
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      JWT_PUBLIC_KEY: -----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
    ports:
      - "8084:8080"
      - "9093:9093"
    depends_on:
      - database

  url-validator:
    build:
      context: ./url-validator
      dockerfile: src/main/docker/Dockerfile.jvm
    ports:
      - "8085:8080"
      - "9092:9092"

  get-item-info:
    build:
      context: ./get-item-info
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
    ports:
      - "8086:8080"
    depends_on:
      - database

volumes:
  db_data:
