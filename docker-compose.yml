services:
  database:
    image: postgres:17.2
    container_name: db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecReT-PasSwOrD
      POSTGRES_DB: database
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  object-management:
    build:
      context: ./
      dockerfile:  object-management/src/main/docker/Dockerfile.${QUARKUS_MODE:-jvm}
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: SecReT-PasSwOrD
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/database
    depends_on:
      - database

volumes:
  db_data: