syntax = "proto3";

option java_multiple_files = true;
option java_package = "dev.eggl.intervals";
option java_outer_classname = "IntervalsProto";

service IntervalService {
  rpc IntervalSubmission(IntervalSubmissionRequest) returns (IntervalSubmissionResponse);

}

message IntervalSubmissionRequest { int32 userId = 1; repeated int32 objectIds = 2; int64 date = 3; }

message IntervalSubmissionResponse { bool success = 1; }
