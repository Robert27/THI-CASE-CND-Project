syntax = "proto3";

package objects;

option java_multiple_files = true;
option java_package = "orderlistservice.objects";
option java_outer_classname = "StorageObjectsProto";

service ObjectService {
  rpc GetStorageObjectsByIds (StorageObjectIdsRequest) returns (StorageObjectsReply);
}

message StorageObjectIdsRequest {
  repeated int32 ids = 1;
}

message StorageObjectsReply {
  repeated StorageObject storageObjects = 1;
}

message StorageObject {
  int32 id = 1;
  string name = 2;
  string description = 3;
  int32 categoryId = 4;
  string reorderUrl = 5;
  int32 quantity = 6;
  int32 weekday = 7; // Optional
}
