syntax = "proto3";

option java_multiple_files = false;
option java_package = "dev.eggl.urlvalidation";
option java_outer_classname = "UrlvalidationProto";

package urlvalidation;

service UrlValidationService {
  rpc ValidateUrl (ValidateUrlRequest) returns (ValidateUrlResponse);
}

// Request-Nachricht
message ValidateUrlRequest {
  string url = 1; // Die URL, die validiert werden soll
}

// Response-Nachricht
message ValidateUrlResponse {
  bool valid = 1;       // true, wenn syntaktisch gültig
  bool reachable = 2;   // true, wenn erreichbar
  string message = 3;   // Fehler- oder Erfolgsmeldung
}
