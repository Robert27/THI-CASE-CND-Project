apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.fullname" . }}-frontend
  labels:
  {{- include "helm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: frontend
    {{- include "helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: frontend
      {{- include "helm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - env:
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: jwt-keys
              key: public.key
        - name: NEXTAUTH_SECRET
          value: {{ quote .Values.frontend.frontend.env.nextauthSecret }}
        - name: AUTH_SERVICE_URL
          value: http://{{ include "helm.fullname" . }}-authservice:8080/login
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.frontend.frontend.image }}
        name: frontend
        resources:
          {{ include "helm.resources" (list "frontend" .) | nindent 10 }}