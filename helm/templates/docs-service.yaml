apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.fullname" . }}-docs
  labels:
  {{- include "helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.docs.type }}
  selector:
    app: docs
    {{- include "helm.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.docs.ports | toYaml | nindent 2 }}