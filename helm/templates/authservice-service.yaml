apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.fullname" . }}-authservice
  labels:
  {{- include "helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.authservice.type }}
  selector:
    app: authservice
    {{- include "helm.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.authservice.ports | toYaml | nindent 2 }}