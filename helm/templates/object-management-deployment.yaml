apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.fullname" . }}-object-management
  labels:
  {{- include "helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.objectManagement.replicas }}
  selector:
    matchLabels:
      app: object-management
    {{- include "helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: object-management
      {{- include "helm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - env:
        - name: DB_HOST
          value: "{{ include "helm.fullname" . }}-{{ .Values.global.database.name }}"
        - name: DB_NAME
          value: {{ quote .Values.global.database.name }}
        - name: DB_PASSWORD
          value: {{ quote .Values.global.database.password }}
        - name: DB_PORT
          value: {{ quote .Values.global.database.port }}
        - name: DB_USERNAME
          value: {{ quote .Values.global.database.username }}
        - name: GRPC_URL_HOST
          value: "{{ include "helm.fullname" . }}-{{ .Values.objectManagement.objectManagement.env.grpcUrlHost }}"
        - name: GRPC_URL_PORT
          value: {{ quote .Values.objectManagement.objectManagement.env.grpcUrlPort }}
        - name: JWT_PUBLIC_KEY
          value: {{ quote .Values.global.jwt.publicKey }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.objectManagement.objectManagement.image }}
        name: object-management
        resources: {}
        livenessProbe:
          {{- toYaml .Values.global.quarkus.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.global.quarkus.readinessProbe | nindent 10 }}