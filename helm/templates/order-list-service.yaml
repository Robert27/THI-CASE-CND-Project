apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.fullname" . }}-order-list
  labels:
  {{- include "helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.orderList.type }}
  selector:
    app: order-list
    {{- include "helm.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.orderList.ports | toYaml | nindent 2 }}