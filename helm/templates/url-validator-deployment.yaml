apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helm.fullname" . }}-url-validator
  labels:
  {{- include "helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.urlValidator.replicas }}
  selector:
    matchLabels:
      app: url-validator
    {{- include "helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: url-validator
      {{- include "helm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.urlValidator.urlValidator.image }}
        name: url-validator
        resources:
          {{ include "helm.resources" (list "urlValidator" .) | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.urlValidator.livenessProbe.httpGet.path | quote }}
            port: {{ .Values.urlValidator.livenessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.urlValidator.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.urlValidator.livenessProbe.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.urlValidator.readinessProbe.httpGet.path | quote }}
            port: {{ .Values.urlValidator.readinessProbe.httpGet.port }}
          initialDelaySeconds: {{ .Values.urlValidator.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.urlValidator.readinessProbe.periodSeconds }}