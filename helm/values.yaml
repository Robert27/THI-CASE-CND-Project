getItemInfo:
  getItemInfo:
    env:
      grpcObjectsHost: object-management
      grpcObjectsPort: "9090"
      grpcUrlHost: url-validator
      grpcUrlPort: "9092"
    image: ghcr.io/robert27/thi-case-cnd-project/get-item-info:latest
  ports:
  - name: item-grpc
    port: 9094
    targetPort: 0
  replicas: 1
  type: ClusterIP
intervalMonitor:
  intervalMonitor:
    env:
      grpcObjectsHost: object-management
      grpcObjectsPort: "9090"
      grpcOrderlistHost: order-list
      grpcOrderlistPort: "9093"
      grpcUsersHost: userservice
      grpcUsersPort: "9091"
      mockEnabled: "true"
    image: ghcr.io/robert27/thi-case-cnd-project/interval-monitor:latest
  ports:
  - name: interval-http
    port: 8081
    targetPort: 0
  replicas: 1
  type: ClusterIP
kubernetesClusterDomain: cluster.local
objectManagement:
  objectManagement:
    env:
      grpcUrlHost: url-validator
      grpcUrlPort: "9092"
    image: ghcr.io/robert27/thi-case-cnd-project/object-management:latest
  ports:
  - name: object-http
    port: 8080
    targetPort: 0
  - name: object-grpc
    port: 9090
    targetPort: 0
  replicas: 1
  type: ClusterIP
orderList:
  orderList:
    env:
      grpcObjectsHost: object-management
      grpcObjectsPort: "9090"
      grpcPricecheckHost: get-item-info
      grpcPricecheckPort: "9094"
    image: ghcr.io/robert27/thi-case-cnd-project/order-list:latest
  ports:
  - name: order-grpc
    port: 9093
    targetPort: 0
  - name: order-http
    port: 8082
    targetPort: 0
  replicas: 1
  type: ClusterIP
pvc:
  databaseData:
    storageRequest: 100Mi
urlValidator:
  ports:
  - name: url-grpc
    port: 9092
    targetPort: 0
  replicas: 1
  type: ClusterIP
  urlValidator:
    image: ghcr.io/robert27/thi-case-cnd-project/url-validator:latest

userservice:
  ports:
  - name: user-grpc
    port: 9091
    targetPort: 0
  - name: user-http
    port: 8080
    targetPort: 0
  replicas: 1
  type: ClusterIP
  image: ghcr.io/robert27/thi-case-cnd-project/user-service:latest
