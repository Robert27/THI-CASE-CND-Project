      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  type: ClusterIP
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: 8085
    initialDelaySeconds: 30
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: 8085
    initialDelaySeconds: 30
