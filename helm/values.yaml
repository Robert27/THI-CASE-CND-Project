      cpu: "1"

getItemInfo:
  getItemInfo:
    env:
      grpcObjectsHost: object-management
      grpcObjectsPort: "9090"
      grpcUrlHost: url-validator
      grpcUrlPort: "9092"
    image: ghcr.io/robert27/thi-case-cnd-project/get-item-info:latest
  ports:
  - name: item-grpc
    port: 9094
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  type: ClusterIP
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: 8086
    initialDelaySeconds: 30
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: 8086
    initialDelaySeconds: 30
    periodSeconds: 5

intervalMonitor:
  intervalMonitor:
    env:
      grpcObjectsHost: object-management
      grpcObjectsPort: "9090"
      grpcOrderlistHost: order-list
      grpcOrderlistPort: "9093"
      grpcUsersHost: userservice
      grpcUsersPort: "9091"
      mockEnabled: "true"
    image: ghcr.io/robert27/thi-case-cnd-project/interval-monitor:latest
  ports:
  - name: interval-http
    port: 8080
    targetPort: 8081
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "250m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  type: ClusterIP
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: 8081
    initialDelaySeconds: 30
    periodSeconds: 5
kubernetesClusterDomain: cluster.local

objectManagement:
  objectManagement:
    env:
      grpcUrlHost: url-validator
      grpcUrlPort: "9092"
    image: ghcr.io/robert27/thi-case-cnd-project/object-management:latest
  ports:
  - name: object-http
    port: 8080
    targetPort: 8080
  - name: object-grpc
    port: 9090
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "500m"
    limits:
      memory: "512Mi"
      cpu: "1"
  type: ClusterIP
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 5

orderList:
  orderList:
    env:
      grpcObjectsHost: object-management
      grpcObjectsPort: "9090"
      grpcPricecheckHost: get-item-info
      grpcPricecheckPort: "9094"
    image: ghcr.io/robert27/thi-case-cnd-project/order-list:latest
  ports:
  - name: order-grpc
    port: 9093
  - name: order-http
    port: 8080
    targetPort: 8082
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "500m"
    limits:
      memory: "512Mi"
      cpu: "1"
  type: ClusterIP
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: 8082
    initialDelaySeconds: 30
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: 8082
    initialDelaySeconds: 30
    periodSeconds: 5
pvc:
  databaseData:
    storageRequest: 100Mi
