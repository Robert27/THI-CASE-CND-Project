services:
  database:
    image: postgres:17.2
    container_name: database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: SecReT-PasSwOrD
      POSTGRES_DB: database
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 10s
      retries: 5

  userservice:
    image: ghcr.io/robert27/thi-case-cnd-project/user-service:latest
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
    ports:
      - "8080:8080"
      - "9091:9091"
    depends_on:
      database:
        condition: service_healthy

  authservice:
    image: ghcr.io/robert27/thi-case-cnd-project/auth-service:latest
    environment:
      JWT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----"
      USERSERVICE_URL: http://userservice:8080/user
    ports:
      - "8081:8081"
    depends_on:
      - userservice

  object-management:
    image: ghcr.io/robert27/thi-case-cnd-project/object-management:latest
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
      GRPC_URL_HOST: url-validator
      GRPC_URL_PORT: 9092
    ports:
      - "9090:9090"
    depends_on:
      database:
        condition: service_healthy

  interval-monitor:
    image: ghcr.io/robert27/thi-case-cnd-project/interval-monitor:latest
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
      GRPC_OBJECTS_PORT: 9090
      GRPC_OBJECTS_HOST: object-management
      GRPC_USERS_PORT: 9091
      GRPC_USERS_HOST: userservice
      GRPC_ORDERLIST_PORT: 9093
      GRPC_ORDERLIST_HOST: order-list
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ghcr.io/robert27/thi-case-cnd-project/frontend:latest
    environment:
      JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
      NEXTAUTH_SECRET: 9n0Gnw+JJ64DsMSXdejaLVNNlLtVzNmhijQlYorTa3Q=
      NEXT_PUBLIC_AUTH_URL: http://nginx:4000/api/auth/login
    ports:
      - "3000:3000"
    depends_on:
      - authservice

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "4000:4000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - userservice
      - authservice
      - object-management
      - interval-monitor
      - frontend

  order-list:
    image: ghcr.io/robert27/thi-case-cnd-project/order-list:latest
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      JWT_PUBLIC_KEY: -----BEGIN PUBLIC KEY----------END PUBLIC KEY-----
      GRPC_PRICECHECK_PORT: 9094
      GRPC_PRICECHECK_HOST: get-item-info
      GRPC_OBJECTS_PORT: 9090
      GRPC_OBJECTS_HOST: object-management
    ports:
      - "8084:8080"
      - "9093:9093"
    depends_on:
      - database

  url-validator:
    image: ghcr.io/robert27/thi-case-cnd-project/url-validator:latest
    ports:
      - "8085:8080"
      - "9092:9092"

  get-item-info:
    image: ghcr.io/robert27/thi-case-cnd-project/get-item-info:latest
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: SecReT-PasSwOrD
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      GRPC_OBJECTS_PORT: 9090
      GRPC_OBJECTS_HOST: object-management
      GRPC_URL_PORT: 9092
      GRPC_URL_HOST: url-validator
    ports:
      - "8086:8080"
      - "9094:9094"
    depends_on:
      - database

  docs:
    image: ghcr.io/robert27/thi-case-cnd-project/docs:latest
    ports:
      - "5100:80"
    environment:
      - BASE_PATH: /docs

volumes:
  db_data:
