services:
  database:
    image: postgres:17.2
    container_name: database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: database
    volumes:
      - db_data:/var/lib/postgresql/data
      # Mount schema.sql so it's run automatically on container creation
      - ./services/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 10s
      retries: 5

  userservice:
    build:
      context: ./services/UserService/
      dockerfile: Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: database
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 5s
      timeout: 17s
      retries: 3
      start_period: 60s
    ports:
      - "8080:8080"
    expose:
      - 9091
    depends_on:
      database:
        condition: service_healthy

  authservice:
    build:
      context: ./services/AuthService/
      dockerfile: Dockerfile
    environment:
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      USERSERVICE_URL: http://userservice:8080/user
    ports:
      - "8081:8081"
    depends_on:
      - userservice

  object-management:
    build:
      context: ./services/object-management
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    ports:
      - "8082:8080"
      - "9090:9090"
    depends_on:
      database:
        condition: service_healthy

  interval-monitor:
    build:
      context: ./services/interval-monitor
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      GRPC_OBJECTS_PORT: 9090
      GRPC_OBJECTS_HOST: object-management
      GRPC_USERS_PORT: 9091
      GRPC_USERS_HOST: userservice
      GRPC_ORDERLIST_PORT: 9093
      GRPC_ORDERLIST_HOST: order-list
    ports:
      - "8083:8081"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    environment:
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SERVICE_URL: http://authservice:8081/login
      DEPLOYMENT_TYPE: compose-dev
    expose:
      - 3000
    depends_on:
      - authservice

  nginx:
    image: nginx:1.27
    container_name: nginx
    ports:
      - "4000:4000"
    volumes:
      - ./services/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - userservice
      - authservice
      - object-management
      - interval-monitor
      - frontend

  order-list:
    build:
      context: ./services/order-list
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      GRPC_PRICECHECK_PORT: 9094
      GRPC_PRICECHECK_HOST: get-item-info
      GRPC_OBJECTS_PORT: 9090
      GRPC_OBJECTS_HOST: object-management
    ports:
      - "8084:8082"
      - "9093:9093"
    depends_on:
      - database

  url-validator:
    build:
      context: ./services/url-validator
      dockerfile: src/main/docker/Dockerfile.jvm
    expose:
      - 9092

  get-item-info:
    build:
      context: ./services/get-item-info
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PORT: 5432
      DB_HOST: database
      DB_NAME: database
      GRPC_OBJECTS_PORT: 9090
      GRPC_OBJECTS_HOST: object-management
      GRPC_URL_PORT: 9092
      GRPC_URL_HOST: url-validator
    ports:
      - "8086:8080"
      - "9094:9094"
    depends_on:
      - database

  docs:
    build:
      context: ./docs/
      dockerfile: Dockerfile
    ports:
      - "5100:80"

volumes:
  db_data:
