apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: frontend
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: frontend
  template:
    metadata:
      labels:
        io.kompose.network/thi-case-cnd-projekt-default: "true"
        io.kompose.service: frontend
    spec:
      containers:
        - env:
            - name: JWT_PUBLIC_KEY
              value: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
            - name: NEXTAUTH_SECRET
              value: 9n0Gnw+JJ64DsMSXdejaLVNNlLtVzNmhijQlYorTa3Q=
            - name: NEXTAUTH_URL
              value: http://localhost
          image: ghcr.io/robert27/thi-case-cnd-project/frontend:latest
          name: frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
