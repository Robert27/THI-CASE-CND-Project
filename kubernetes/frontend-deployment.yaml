apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/robert27/thi-case-cnd-project/frontend:latest
          imagePullPolicy: Always
          env:
            - name: JWT_PUBLIC_KEY
              value: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
            - name: NEXTAUTH_SECRET
              value: 9n0Gnw+JJ64DsMSXdejaLVNNlLtVzNmhijQlYorTa3Q=
            - name: AUTH_SERVICE_URL 
              value: http://authservice:8081/login