apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose-cloud.yml --out kubernetes
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: frontend
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: frontend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose-cloud.yml --out kubernetes
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: frontend
    spec:
      containers:
        - env:
            - name: JWT_PUBLIC_KEY
              value: '-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----'
            - name: NEXTAUTH_SECRET
              value: 9n0Gnw+JJ64DsMSXdejaLVNNlLtVzNmhijQlYorTa3Q=
            - name: NEXTAUTH_URL
              value: http://localhost:8081
          image: ghcr.io/robert27/thi-case-cnd-project/frontend:main
          name: frontend
          ports:
            - containerPort: 3000
              protocol: TCP
      restartPolicy: Always
