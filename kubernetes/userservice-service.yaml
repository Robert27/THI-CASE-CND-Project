apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o kubernetes
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: userservice
  name: userservice
spec:
  ports:
    - name: "9091"
      port: 9091
      targetPort: 9091
    - name: "8080"
      port: 8080
      targetPort: 8080
  selector:
    io.kompose.service: userservice
