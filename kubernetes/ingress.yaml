apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: docs
                port:
                  name: docs-http

          - path: /rest/user/(.*)
            pathType: Prefix
            backend:
              service:
                name: userservice
                port:
                  name: user-http

          - path: /rest/object/(.*)
            pathType: Prefix
            backend:
              service:
                name: object-management
                port:
                  name: object-http

          - path: /rest/order/(.*)
            pathType: Prefix
            backend:
              service:
                name: order-list
                port:
                  name: order-http

          - path: /rest/auth/(.*)
            pathType: Prefix
            backend:
              service:
                name: authservice
                port:
                  name: auth-http

          - path: /rest/interval/(.*)
            pathType: Prefix
            backend:
              service:
                name: interval-monitor
                port:
                  name: interval-http

          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: frontend-http