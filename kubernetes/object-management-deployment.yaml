apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose-cloud.yml --out kubernetes
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: object-management
  name: object-management
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: object-management
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose-cloud.yml --out kubernetes
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: object-management
    spec:
      containers:
        - env:
            - name: DB_HOST
              value: database
            - name: DB_NAME
              value: database
            - name: DB_PASSWORD
              value: SecReT-PasSwOrD
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: JWT_PUBLIC_KEY
              value: '-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----'
          image: ghcr.io/robert27/thi-case-cnd-project/object-management:main
          name: object-management
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 9090
              protocol: TCP
      restartPolicy: Always
