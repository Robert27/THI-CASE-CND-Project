apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-management
  template:
    metadata:
      labels:
        app: object-management
    spec:
      containers:
        - name: object-management
          image: ghcr.io/robert27/thi-case-cnd-project/object-management:latest
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              value: database
            - name: DB_NAME
              value: database
            - name: DB_PASSWORD
              value: SecReT-PasSwOrD
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: GRPC_URL_HOST
              value: url-validator
            - name: GRPC_URL_PORT
              value: "9092"
            - name: JWT_PUBLIC_KEY
              value: '-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----'
