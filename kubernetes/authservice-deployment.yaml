apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
    spec:
      containers:
        - name: authservice
          image: ghcr.io/robert27/thi-case-cnd-project/auth-service:latest
          imagePullPolicy: Always
          env:
            - name: JWT_PRIVATE_KEY
              value: '-----BEGIN PRIVATE KEY----------END PRIVATE KEY-----'
            - name: USERSERVICE_URL
              value: http://userservice:8080/user
