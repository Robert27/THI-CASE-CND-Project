apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: interval-monitor
  name: interval-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: interval-monitor
  template:
    metadata:
      labels:
        io.kompose.network/thi-case-cnd-projekt-default: "true"
        io.kompose.service: interval-monitor
    spec:
      containers:
        - env:
            - name: DB_HOST
              value: database
            - name: DB_NAME
              value: database
            - name: DB_PASSWORD
              value: SecReT-PasSwOrD
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: GRPC_OBJECTS_HOST
              value: object-management
            - name: GRPC_OBJECTS_PORT
              value: "9090"
            - name: GRPC_ORDERLIST_HOST
              value: order-list
            - name: GRPC_ORDERLIST_PORT
              value: "9093"
            - name: GRPC_USERS_HOST
              value: userservice
            - name: GRPC_USERS_PORT
              value: "9091"
            - name: JWT_PUBLIC_KEY
              value: '-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----'
            - name: MOCK_ENABLED
              value: "true"
          image: ghcr.io/robert27/thi-case-cnd-project/interval-monitor:latest
          name: interval-monitor
          ports:
            - containerPort: 8081
              protocol: TCP
      restartPolicy: Always
