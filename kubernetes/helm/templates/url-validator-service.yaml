apiVersion: v1
kind: Service
metadata:
  name: {{ include "helm.fullname" . }}-url-validator
  labels:
  {{- include "helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.urlValidator.type }}
  selector:
    app: url-validator
    {{- include "helm.selectorLabels" . | nindent 4 }}
  ports:
  {{- .Values.urlValidator.ports | toYaml | nindent 2 }}