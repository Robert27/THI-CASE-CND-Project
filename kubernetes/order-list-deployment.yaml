apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-list
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-list
  template:
    metadata:
      labels:
        app: order-list
    spec:
      containers:
        - env:
            - name: DB_HOST
              value: database
            - name: DB_NAME
              value: database
            - name: DB_PASSWORD
              value: SecReT-PasSwOrD
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              value: postgres
            - name: GRPC_OBJECTS_HOST
              value: object-management
            - name: GRPC_OBJECTS_PORT
              value: "9090"
            - name: GRPC_PRICECHECK_HOST
              value: get-item-info
            - name: GRPC_PRICECHECK_PORT
              value: "9094"
            - name: JWT_PUBLIC_KEY
              value: '-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----'
          image: ghcr.io/robert27/thi-case-cnd-project/order-list:latest
          name: order-list
      restartPolicy: Always
