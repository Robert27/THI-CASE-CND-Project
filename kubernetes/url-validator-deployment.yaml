apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml -o kubernetes
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: url-validator
  name: url-validator
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: url-validator
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml -o kubernetes
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: url-validator
    spec:
      containers:
        - image: ghcr.io/robert27/thi-case-cnd-project/url-validator:latest
          name: url-validator
          ports:
            - containerPort: 9092
              protocol: TCP
      restartPolicy: Always
